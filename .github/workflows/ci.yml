name: Cross-Platform CI
on:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: "pyproject.toml"

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Configure Git (Required Aider)
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"

    - name: Install dependencies
      run: uv sync

    - name: Install Playwright Browsers
      run: uv run playwright install chromium

    - name: Run Test Suite
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        uv run --with pytest pytest -s src/aider_factory/tests/ \
          --ignore="src/aider_factory/tests/aider_factory_tests/end-to-end/test_e2e_docling_pipeline.py" \
          --ignore="src/aider_factory/tests/aider_factory_tests/end-to-end/test_e2e_max_chat_history_tokens.py" \
          --ignore="src/aider_factory/tests/aider_factory_tests/end-to-end/test_e2e_architect_summarization.py" \
          -v
