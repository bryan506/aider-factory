name: "My Project"
working_directory: "/path/to/project"

colors:
    architect_debate: "#38bdf8"
    oracle_debate: "#d3869b"

test_command_prefix: "bash"
test_runner: "{file}"
test_naming_and_path: "src/aider_factory/tests/aider_factory_tests/end-to-end/test_e2e_{stem}.py"
lint_cmd: null
auto_lint: true
loop_aider_test: 3

endpoints:
    architect_api_base: "http://192.168.100.2:8080/v1"
    editor_api: "http://192.168.100.1:8080/v1"
    editor_api_fallback: "http://192.168.100.1:8080/v1"
    rag_agent_api: "http://192.168.100.1:8080/v1"
    grounding_agent_api: "http://192.168.100.1:8090/v1"
    ranking_api_base: null
    ocr_api_base: "http://192.168.100.2:8081/v1"
    embed_api_base: "http://192.168.100.1:8080/v1"

phases:
  - name: "Literary Review — Full Pipeline"
    enabled: true

    models:
        architect_agent: "gemini/gemini-3.7-flash"
        editor_agent: "gemini/gemini-3.6-flash"
        editor_agent_test: "gemini/gemini-3.6-flash"
        editor_agent_test_fallback: "gemini/gemini-3.6-flash"
        rag_agent: "gemini/gemini-3.6-flash"
        ranking_agent: "jinaai/jina-reranker-v3.5"
        ocr_agent: "gemini/gemini-3.6-flash"
        embed_model: "gemini/text-embedding-004"
        grounding_agent: "openai/minicheck-flan-t5-large"

    rag:
        collection_name: "my_papers"
        batch: false
        retrieval_mode: top_k
        run_ocr_rag: true
        embed_backend: "sentence-transformers"
        query_prefix: "Instruct: Given an academic query, retrieve relevant passages\nQuery: "
        ocr_prompt: "<|grounding|>Convert the document to markdown."

    oracle:
        start_job: true
        template: ".aider_factory/markdown/templates/literary_review_template.md"
        full_document: true

    toggles:
        pair_programming: false
        shared_history: false
        run_job_one: false
        run_job_two: false
        run_job_three: false
        iterate_test: true
        auto_test: false
        sticky_context: false
        map_tokens: 0
        map_refresh: "manual"
        map_multiplier_no_files: 0
        max_chat_history_tokens: 30000
        yes_always: false
        auto_accept_architect: true
        auto_commits: true
        suggest_shell_commands: true
        detect_urls: false
        disable_playwright: false

    validation:
        enabled: true
        validation_tag: "evidence"
        region_threshold: 0.60
        region_margin: 2
        region_paragraphs: 0
        region_top_k: 5
        validation_loops: 3
        redo_oracle_job: false
        verify_all_claims: false
        entail_threshold: 0.5

    escalation_debate:
        loops: 4
        rounds: 2
        pass_history: false

    files:
        target_files:
            - ".aider_factory/markdown/lanceDB/my_papers/literary_review/Paper-Title-One.md"
            - ".aider_factory/markdown/lanceDB/my_papers/literary_review/Paper-Title-Two.md"
        extra_editable_files: []
        test_files:
            - ".aider_factory/tests/validations/validations_context_check.sh"
        context_files_job: []
        context_files_test: []

    plans:
        job_one_plan: "markdown/templates/implement.md"
        job_two_plan: "markdown/templates/validate.md"
        job_three_plan: "markdown/templates/testing.md"
        iterate_plan: "markdown/internal/contextual_revalidation_template.md"
