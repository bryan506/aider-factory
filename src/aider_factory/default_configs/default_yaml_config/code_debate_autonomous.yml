name: "Autonomous Code Debate Pipeline"
working_directory: "/path/to/project"

test_command_prefix: ""
test_runner: "pytest {file}"
test_naming_and_path: "tests/test_{stem}.py"
loop_aider_test: 3

# Uncomment for local model endpoints (not needed for gemini/ prefixes)
# endpoints:
#     architect_api_base: "http://localhost:8080/v1"
#     editor_ollama_api: "http://localhost:8080/v1"
#     editor_test_ollama_api: "http://localhost:8080/v1"
#     rag_agent_api: "http://localhost:8080/v1"

phases:
    # Phase 0: Interactive or Autonomous Strategy Creation
    # pair_programming: true drops user into interactive planning.
    # On exit, sticky_context passes strategy_template.md to downstream phases.
    - name: "Strategy — Debate and Plan"
      enabled: true

      models:
          architect_agent: "gemini/gemini-2.5-flash"
          editor_agent: "gemini/gemini-2.5-flash"
          editor_agent_test: "gemini/gemini-2.5-flash"
          editor_agent_test_fallback: "gemini/gemini-2.5-flash"
          rag_agent: "gemini/gemini-2.5-flash"
          embed_model: "BAAI/bge-m3"

      rag:
          collection_name: "project_docs"
          batch: true
          retrieval_mode: top_k
          run_ocr_rag: false                   # true on first run to ingest code/docs
          vectordb_overwrite: false
          ocr_prompt: "Extract the text, tables, and mathematical formulas from this page into clean Markdown. Preserve all structural integrity."
          query_prefix: "Instruct: Given a coding query, retrieve relevant passages\nQuery: "
          embed_backend: "sentence-transformers"
          chunk_size_chars: 800
          chunk_overlap_chars: 100
          top_k: 30
          cer_threshold: 0.05
          ocr_max_retries: 2
          ocr_parallel: 1
          ocr_max_tokens: 4096
          code_chunk_size: 2000
          working_repo: ""
          code_exts: null
          text_doc_exts: null
          ignore: null

      oracle:
          start_job: false
          template: "src/aider_factory/markdown/internal/analyze_bugs.md"
          full_document: false
          pre_edit_debate:
              enabled: true
              insert_debate: [1, 0, 0]
              loops: 3
              job_debate_template: "src/aider_factory/markdown/oracle_pre_plan/strategy_instruct_template.md"
              job_debate_collection: "project_docs"

      toggles:
          pair_programming: true
          run_job_one: true                    # Writes strategy to target
          run_job_two: false
          run_job_three: false
          iterate_test: false
          auto_test: false
          sticky_context: true                 # strategy_template.md carries to Phase 1

      validation:
          enabled: false
          validation_tag: "evidence"
          region_threshold: 0.60
          region_margin: 2
          region_paragraphs: 0
          region_top_k: 5
          validation_loops: 3
          redo_oracle_job: false
          verify_all_claims: false
          entail_threshold: 0.5

      escalation_debate:
          loops: 4
          rounds: 2
          pass_history: true

      files:
          target_files:
              - ".aider_factory/markdown/oracle_pre_plan/strategy_template.md"
          extra_editable_files: []
          test_files: []
          context_files_job: []
          context_files_test: []

      plans:
          job_one_plan: "markdown/oracle_pre_plan/strategy_instruct_template.md"
          job_two_plan: null
          job_three_plan: null
          iterate_plan: "markdown/templates/testing_unit_iterate.md"

    # Phase 1: Autonomous 4-Stage Execution (Implement -> Audit -> Write Tests -> Self-Heal)
    # job_two_plan: null triggers programmatic injection of strategy_template.md into validate.md
    - name: "Implementation — Debate and Build"
      enabled: true

      models:
          architect_agent: "gemini/gemini-2.5-flash"
          editor_agent: "gemini/gemini-2.5-flash"
          editor_agent_test: "gemini/gemini-2.5-flash"
          editor_agent_test_fallback: "gemini/gemini-2.5-flash"
          rag_agent: "gemini/gemini-2.5-flash"
          embed_model: "BAAI/bge-m3"

      rag:
          collection_name: "project_docs"
          batch: true
          retrieval_mode: top_k
          run_ocr_rag: false
          vectordb_overwrite: false
          ocr_prompt: "Extract the text, tables, and mathematical formulas from this page into clean Markdown. Preserve all structural integrity."
          query_prefix: "Instruct: Given a coding query, retrieve relevant passages\nQuery: "
          chunk_size_chars: 800
          chunk_overlap_chars: 100
          top_k: 30
          cer_threshold: 0.05
          ocr_max_retries: 2
          ocr_parallel: 1
          ocr_max_tokens: 4096
          code_chunk_size: 2000
          working_repo: ""
          code_exts: null
          text_doc_exts: null
          ignore: null

      oracle:
          start_job: false
          template: "src/aider_factory/markdown/internal/analyze_bugs.md"
          full_document: false
          pre_edit_debate:
              enabled: true
              insert_debate: [1, 0, 0]
              loops: 3
              job_debate_template: "src/aider_factory/markdown/internal/analyze_bugs.md"
              job_debate_collection: "project_docs"

      toggles:
          run_job_one: true                    # Job 1: Implement
          run_job_two: true                    # Job 2: Validate / Audit
          run_job_three: true                  # Job 3: Write Tests
          iterate_test: true                   # Job 4: Self-Healing Test Loop
          auto_test: false
          pair_programming: false
          sticky_context: true                 # Carries strategy from Phase 0

      validation:
          enabled: false
          validation_tag: "evidence"
          region_threshold: 0.60
          region_margin: 2
          region_paragraphs: 0
          region_top_k: 5
          validation_loops: 3
          redo_oracle_job: false
          verify_all_claims: false
          entail_threshold: 0.5

      escalation_debate:
          loops: 4
          rounds: 2
          pass_history: true

      files:
          target_files:
              - "src/my_module.py"
          extra_editable_files:
              - "src/helpers.py"
          test_files:
              - "tests/test_my_module.py"
          context_files_job:
              - "src/utils.py"
          context_files_test:
              - "src/utils.py"

      plans:
          job_one_plan: "markdown/templates/implement.md"
          job_two_plan: null
          job_three_plan: "markdown/templates/testing.md"
          iterate_plan: "markdown/templates/testing_unit_iterate.md"

    # Phase 2: Final Pair Review
    - name: "Phase 2 — Final Pair Review"
      enabled: true

      models:
          architect_agent: "gemini/gemini-2.5-flash"
          editor_agent: "gemini/gemini-2.5-flash"

      toggles:
          pair_programming: true
          run_job_one: true
          run_job_two: false
          run_job_three: false
          iterate_test: false

      files:
          target_files:
              - "src/my_module.py"

      plans:
          job_one_plan: "markdown/templates/general.md"
