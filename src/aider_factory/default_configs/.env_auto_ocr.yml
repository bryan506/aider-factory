name: "My Project"
working_directory: "/path/to/project"

colors:
    architect_debate: "#38bdf8" # teal — architect turns in ask-mode debates
    oracle_debate: "#d3869b" # gruvbox pink — oracle turns in debates

test_command_prefix: "docker exec -i --user bryanr -w /home/bryanr/wf/BaseFeatures -e RETICULATE_PYTHON=/home/bryanr/.venv-rocker/bin/python3 rocker-rstudio"
test_runner: "Rscript .aider_factory/tests/run_tests.R {file}"
test_naming_and_path: "tests/testthat/test-{stem}.R"
loop_aider_test: 3

# 3. GLOBAL API ENDPOINTS (Unified: All network addresses live here)
endpoints:
    architect_api_base: "http://192.168.100.2:8080/v1"
    editor_ollama_api: "http://192.168.100.1:8080/v1"
    editor_test_ollama_api: "http://192.168.100.1:8080/v1"
    rag_agent_api: "http://192.168.100.1:8080/v1"
    grounding_agent_api: "http://192.168.100.1:8090/v1"
    ocr_api_base: "http://192.168.100.2:8081/v1"
    embed_api_base: "http://192.168.100.1:8080/v1"

phases:
    - name: "Literary Review — End-to-End"
      enabled: true

      models:
          architect_agent: "gemini/gemini-3.5-flash"
          editor_agent: "gemini/gemini-2.5-flash"
          editor_agent_test: "gemini/gemini-2.5-flash"
          editor_agent_test_fallback: "gemini/gemini-2.5-flash"
          rag_agent: "gemini/gemini-3.5-flash"
          ocr_agent: "glm-ocr-f16:LATEST"
          embed_model: "qwen3-embedding-8b-8k:LATEST"
          grounding_agent: "lm_studio/minicheck-flan-t5-large"

      rag:
          collection_name: "summer_intern_papers"
          batch: false
          retrieval_mode: top_k
          run_ocr_rag: false
          vectordb_overwrite: false
          ocr_prompt: "Extract the text, tables, and mathematical formulas from this page into clean Markdown. Preserve all structural integrity."
          query_prefix: "Query: "
          chunk_size_chars: 800
          chunk_overlap_chars: 100
          top_k: 5
          cer_threshold: 0.05
          ocr_max_retries: 2
          ocr_parallel: 1
          code_chunk_size: 2000
          ocr_max_tokens: 4096
          embed_backend: "sentence-transformers"
          working_repo: ""
          code_exts: null
          text_doc_exts: null
          ignore: null

      oracle:
          start_job: true
          template: ".aider_factory/markdown/templates/literary_review_template.md"
          full_document: true
          pre_edit_debate:
              enabled: false
              job_debate_template: ""

      toggles:
          pair_programming: false
          run_job_one: false
          run_job_two: false
          iterate_test: true
          auto_test: false
          sticky_context: false

      validation:
          enabled: true
          validation_tag: "evidence"
          region_threshold: 0.60
          region_margin: 2
          region_paragraphs: 2
          region_top_k: 5
          validation_loops: 3
          redo_oracle_job: true
          verify_all_claims: false
          entail_threshold: 0.5

      escalation_debate:
          loops: 4
          rounds: 2
          pass_history: true

      files:
          target_files:
              - "lit_reviews/Have-Capital-Market-Anomalies-Attenuated-in-the-Recent-Era-of-High-Liquidity-and-Trading-Activity.md"
          extra_editable_files: []
          test_files:
              - ".aider_factory/tests/validations/validations_context_check.sh"
          context_files_job: []
          context_files_test: []

      plans:
          job_one_plan: ""
          job_two_plan: ""
          iterate_plan: "markdown/internal/contextual_revalidation_template.md"

    - name: "Code — Implement, Test, Debate-Escalate"
      enabled: true

      models:
          architect_agent: "gemini/gemini-3.5-flash"
          editor_agent: "gemini/gemini-2.5-flash"
          editor_agent_test: "gemini/gemini-2.5-flash"
          editor_agent_test_fallback: "gemini/gemini-2.5-flash"
          rag_agent: "gemini/gemini-2.5-flash"
          ocr_agent: "glm-ocr-f16:LATEST"
          embed_model: "qwen3-embedding-8b-8k:LATEST"
          grounding_agent: "openai/minicheck-flan-t5-large"

      rag:
          collection_name: "BaseFeatures_lib"
          batch: true
          retrieval_mode: top_k
          run_ocr_rag: false
          vectordb_overwrite: false
          ocr_prompt: "Extract text, tables, math, code, and documentation into clean Markdown. Preserve all structural integrity."
          query_prefix: "Instruct: Given a coding or financial query, retrieve relevant passages\\nQuery: "
          chunk_size_chars: 800
          chunk_overlap_chars: 100
          top_k: 30
          cer_threshold: 0.05
          ocr_max_retries: 2
          ocr_parallel: 8
          code_chunk_size: 2000
          ocr_max_tokens: 4096
          embed_backend: "sentence-transformers"
          working_repo: ""
          code_exts: null
          text_doc_exts: null
          ignore: null

      oracle:
          start_job: false
          template: "src/aider_factory/markdown/internal/analyze_bugs.md"
          full_document: false
          pre_edit_debate:
              enabled: false
              job_debate_template: ""

      toggles:
          pair_programming: true
          run_job_one: false
          run_job_two: true
          iterate_test: false
          auto_test: false
          sticky_context: true

      validation:
          enabled: false
          validation_tag: "evidence"
          region_threshold: 0.60
          region_margin: 2
          region_paragraphs: 0
          region_top_k: 5
          validation_loops: 3
          redo_oracle_job: false
          verify_all_claims: false
          entail_threshold: 0.5

      escalation_debate:
          loops: 4
          rounds: 2
          pass_history: true

      files:
          target_files:
              - "R/lq_leverage_b.R"
          extra_editable_files:
              - "R/helpers_kv.R"
              - "R/helpers.R"
              - "R/lq_leverage_bl.R"
          test_files:
              - "tests/testthat/test-unit-lq_leverage_b.R"
          context_files_job:
              - "R/queries.R"
              - "R/reservations.R"
              - "R/validations.R"
          context_files_test:
              - "R/queries.R"
              - "R/reservations.R"
              - "R/validations.R"

      plans:
          job_one_plan: "markdown/templates/general.md"
          job_two_plan: "markdown/templates/testing.md"
          iterate_plan: "markdown/templates/testing_unit_iterate.md"
