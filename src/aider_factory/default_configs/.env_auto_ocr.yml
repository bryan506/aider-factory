    # deliberate_plan / apply_plan -> code defaults (deliberation_evidence_template.md /
    # apply_evidence_template.md). Set here only to override.

  - name: "Code — Implement, Test, Debate-Escalate"
    enabled: true

    models:
        architect_agent: "gemini/gemini-3.5-flash"
        editor_agent: "gemini/gemini-2.5-flash"
        editor_agent_test: "gemini/gemini-2.5-flash"
        editor_agent_test_fallback: "gemini/gemini-2.5-flash"
        rag_agent: "gemini/gemini-3.1-pro-preview"
        ocr_agent: "glm-ocr-f16:LATEST"
        embed_model: "qwen3-embedding-8b-8k:LATEST"
        grounding_agent: "openai/minicheck-flan-t5-large"

    rag:
        collection_name: "BaseFeatures_lib"
        batch: true
        retrieval_mode: top_k
        run_ocr_rag: false
        vectordb_overwrite: false
        query_prefix: "Instruct: Given a coding or financial query, retrieve relevant passages\nQuery: "
        chunk_size_chars: 800
        chunk_overlap_chars: 100
        top_k: 30
        cer_threshold: 0.05
        ocr_max_retries: 2
        ocr_parallel: 8
        code_chunk_size: 2000

    oracle:
        start_job: false
        template: ".aider_factory/markdown/internal/analyze_bugs.md"
        full_document: false
        architect_oracle_chat: false
        job_debate_template: []

    toggles:
        pair_programming: true
        run_job_one: false
        run_job_two: true
        iterate_test: false
        auto_test: false
        sticky_context: true

    validation:
        enabled: false
        validation_tag: "evidence"
        region_threshold: 0.60
        region_margin: 2
        region_paragraphs: 0
        region_top_k: 5
        validation_loops: 3
        redo_oracle_job: false
        verify_all_claims: false
        entail_threshold: 0.5

    escalation_debate:
        loops: 4
        rounds: 2
        pass_history: true

    files:
          target_files:
              - "R/lq_leverage_b.R"
          extra_editable_files:
              - "R/helpers_kv.R"
              - "R/helpers.R"
              - "R/lq_leverage_bl.R"
          test_files:
              - "tests/testthat/test-unit-lq_leverage_b.R"
          context_files_job:
              - "R/queries.R"
              - "R/reservations.R"
              - "R/validations.R"
          context_files_test:
              - "R/queries.R"
              - "R/reservations.R"
              - "R/validations.R"
    # deliberate_plan omitted -> code mode uses oracle_auto.template (analyze_bugs.md)

    plans:
        job_one_plan: "markdown/templates/general.md"
        job_two_plan: "markdown/templates/testing.md"
        iterate_plan: "markdown/templates/testing_unit_iterate.md"
