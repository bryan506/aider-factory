name: "My Project"
working_directory: "/path/to/project"

test_command_prefix: ""
test_runner: "pytest {file}"
test_naming_and_path: "tests/test_{stem}.py"
loop_aider_test: 3

# Uncomment for local model endpoints
# endpoints:
#     architect_api_base: "http://localhost:8080/v1"
#     editor_ollama_api: "http://localhost:11434"
#     editor_test_ollama_api: "http://localhost:11434"

models:
    architect_agent: "gemini/gemini-2.5-flash"
    editor_agent: "gemini/gemini-2.5-flash"
    editor_agent_test: "gemini/gemini-2.5-flash"
    editor_agent_test_fallback: "gemini/gemini-2.5-flash"

plans:
    job_one_plan: "markdown/templates/implement.md"
    job_two_plan: "markdown/templates/testing.md"

phases:
    - name: "Pair Programming Session"
      enabled: true

      rag:
          collection_name: ""
          batch: true
          retrieval_mode: top_k
          run_ocr_rag: false
          vectordb_overwrite: false
          ocr_prompt: "Extract the text, tables, and mathematical formulas from this page into clean Markdown. Preserve all structural integrity."
          query_prefix: "Instruct: Given a coding or financial query, retrieve relevant passages\nQuery: "
          chunk_size_chars: 800
          chunk_overlap_chars: 100
          top_k: 5
          cer_threshold: 0.05
          ocr_max_retries: 2
          ocr_parallel: 1
          ocr_max_tokens: 4096
          code_chunk_size: 2000
          working_repo: ""
          code_exts: null
          text_doc_exts: null
          ignore: null

      oracle:
          start_job: false
          template: ""
          full_document: false
          pre_edit_debate:
              enabled: false
              job_debate_template: []

      toggles:
          pair_programming: true       # interactive — you drive the conversation
          run_job_one: true            # plan template loaded as read-only context
          run_job_two: false           # direct test writing manually in conversation
          iterate_test: true           # test-fix loop available when you trigger tests
          auto_test: false             # architect participates every attempt
          sticky_context: false

      validation:
          enabled: false
          validation_tag: "evidence"
          region_threshold: 0.60
          region_margin: 2
          region_paragraphs: 0
          region_top_k: 5
          validation_loops: 3
          redo_oracle_job: false
          verify_all_claims: false
          entail_threshold: 0.5

      escalation_debate:
          loops: 0
          rounds: 1
          pass_history: false

      files:
          target_files:
              - "src/my_module.py"
          extra_editable_files:
              - "src/helpers.py"
          test_files:
              - "tests/test_my_module.py"
          context_files_job:
              - "src/utils.py"
          context_files_test:
              - "src/utils.py"

