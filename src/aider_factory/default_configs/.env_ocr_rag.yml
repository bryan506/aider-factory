# =============================================================================
# AI FACTORY PIPELINE — ULTRA-STREAMLINED CONFIGURATION
# =============================================================================
name: "Aider Config Reconciliation"
working_directory: "/home/ares/R/aider_factory_dev"

# -----------------------------------------------------------------------------
# 1. DISPLAY & RETRY CONTROLS
# -----------------------------------------------------------------------------
colors:
    architect_debate: "#38bdf8"
    oracle_debate: "#d3869b"

test_command_prefix: ""
test_runner: "echo 'No tests configured for this session'"
test_naming_and_path: "tests/test_{stem}.py"
loop_aider_test: 1

# -----------------------------------------------------------------------------
# 2. GLOBAL MODELS (Unified: All model strings live here)
# -----------------------------------------------------------------------------
models:
    architect_agent: "gemini/gemini-3.5-flash"
    editor_agent: "gemini/gemini-2.5-flash"
    editor_agent_test: "gemini/gemini-2.5-flash"
    editor_agent_test_fallback: "gemini/gemini-2.5-flash"
    rag_agent: "gemini/gemini-3.5-flash"
    ocr_agent: "glm-ocr-f16:latest"
    embed_model: "qwen3-embedding-8b-8k:LATEST"
    grounding_agent: "openai/minicheck-flan-t5-large"

# -----------------------------------------------------------------------------
# 3. GLOBAL API ENDPOINTS (Unified: All network addresses live here)
# -----------------------------------------------------------------------------
endpoints:
    architect_api_base: "${ARCHITECT_API_BASE:-http://localhost:11434/v1}"
    editor_ollama_api: "${EDITOR_OLLAMA_API:-http://localhost:11434}"
    editor_test_ollama_api: "${EDITOR_TEST_OLLAMA_API:-http://localhost:11434}"
    rag_agent_api: "${RAG_AGENT_API:-http://localhost:11434/v1}"
    grounding_agent_api: "${GROUNDING_AGENT_API:-http://localhost:8090/v1}"
    ocr_api_base: "${OCR_API_BASE:-http://192.168.100.2:8081/v1}"
    embed_api_base: "${EMBED_API_BASE:-http://192.168.100.2:8080/v1}"

# -----------------------------------------------------------------------------
# 4. GLOBAL PLANS (Unified: All prompt templates live here)
# -----------------------------------------------------------------------------
plans:
    job_one_plan: "markdown/templates/implement.md"
    job_two_plan: "markdown/templates/testing.md"
    deliberate_plan: "markdown/internal/deliberation_evidence_template.md"
    apply_plan: "markdown/internal/apply_evidence_template.md"
    analyze_bugs_plan: "markdown/internal/analyze_bugs.md"
    iterate_plan: "markdown/templates/testing_helpers.md"

# =============================================================================
# PHASES
# =============================================================================
phases:
  - name: "Reconcile Aider Configurations"
    enabled: true

    # Cleaned: Phase-level RAG overrides are placed inside a single 'rag' block
    rag:
        collection_name: "" # Empty to bypass RAG database queries
        batch: true
        retrieval_mode: top_k
        run_ocr_rag: false
        vectordb_overwrite: false
        ocr_prompt: "Extract text, tables, math, code, and documentation into clean Markdown. Preserve all structural integrity."
        query_prefix: "Query: " # allows semantic search, helps embedder
        chunk_size_chars: 800
        chunk_overlap_chars: 100
        top_k: 5
        cer_threshold: 0.05
        ocr_max_retries: 2
        ocr_parallel: 1
        ocr_max_tokens: 4096
        code_chunk_size: 2000
        working_repo: ""
        code_exts: null
        text_doc_exts: null
        ignore: null

    # Cleaned: Programmatic side-agent and pre-edit debate configuration
    oracle:
        start_job: true
        template: "src/aider_factory/markdown/templates/literary_review_template.md"
        full_document: true
        pre_edit_debate:
            enabled: true
            job_debate_template:
                - "src/aider_factory/markdown/templates/evidence_anchor_validation.md"

    # Cleaned: Purely Aider/execution flow switches
    toggles:
        pair_programming: true
        run_job_one: true
        run_job_two: false
        iterate_test: false
        auto_test: false
        sticky_context: true

    # Cleaned: Grouped by validation vs. escalation debate
    validation:
        enabled: false
        validation_tag: "evidence"
        region_threshold: 0.60
        region_margin: 2
        region_paragraphs: 0
        region_top_k: 5
        validation_loops: 3
        redo_oracle_job: false
        verify_all_claims: false
        entail_threshold: 0.5

    # Cleaned: Dedicated escalation debate section
    escalation_debate:
        loops: 0
        rounds: 1
        pass_history: false

    # Cleaned: Files queue and context
    files:
        target_files:
            - "src/aider_factory/default_configs/.env_ocr_rag.yml"
        extra_editable_files: []
        test_files: []
        context_files_job:
            - "src/aider_factory/default_configs/default_yaml_config/*.yml"
            - "src/aider_factory/markdown/factory_service_manual.md"
            - "src/aider_factory/markdown/yaml_docs_sample.md"
            - "src/aider_factory/python/*.py"
        context_files_test: []
