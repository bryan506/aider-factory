# .aider.conf.yml
# App-wide operational configurations
check-update: false
show-release-notes: false
notifications: false
analytics: false
no-show-model-warnings: true


# Caching & Timeouts
timeout: "10800"

# Repository Map Parameters (Optimized for Large Projects)
# toggle these for pair programming
max-chat-history-tokens: "90000"
map-tokens: "0"
map-refresh: manual # or manual, auto, always, files
yes-always: true ## read below
auto-accept-architect: true
architect: true ## toggle on and off along with yes-always for automatic commands, so far commands only works in /code-edit mode.
auto-commits: true
suggest-shell-commands: true
detect-urls: true
disable-playwright: false
fancy-input: true
multiline: false
auto-lint: true
map-multiplier-no-files: 0
# Architecture & Mode Settings

editor-edit-format: editor-diff
# Allow the agent to propose shell commands (e.g. the Knowledge Oracle skill).
# Autonomy/approval is governed separately by --yes-always.
weak-model: "gemini/gemini-2.5-flash"
# weak-model: "gemini/gemini-2.5-flash"
# gemma4-12B-90k:latest
#
# Global Automation & Silence Settings
no-show-model-warnings: true
dark-mode: false
code-theme: gruvbox-dark # friendly for light monokai for dark.
# user-input-color: "#ff00ff"
user-input-color: "#d97706" # Controls the prompt text, file listings, and /commands
assistant-output-color: "#38bdf8" # icy blue agent response
# tool-output-color: "#0284c7" # Controls the output of /test or /run commands (blue)
# tool-error-color: "#dc2626" # Controls error text (red)
# assistant-output-color: "#cbd5e1" # Controls the LLM's streaming response text

pretty: true

# Git Management (Keep true to allow auto-commits while caching!)

attribute-author: false
attribute-committer: false

# Directory Redirection (Keeps root folder clean)
restore-chat-history: false
chat-history-file: .aider_factory/.aider.chat.history.md
input-history-file: .aider_factory/.aider.input.history
# no-check-model-accepts-settings: true
# Thinking control: 0=off, 3k=3000 tokens, 8k=8000 tokens
# thinking-tokens: "0"

