name: "Basis Feature Refactor"
working_directory: "/home/bryanr/wf/BaseFeatures"

# Terminal colors for non-Aider pipeline output (24-bit hex).
# Aider's own colors are controlled via .aider.conf.yml — these only affect
# the pipeline's debate banners and streamed oracle/architect output.
colors:
    architect_debate: "#38bdf8" # teal — architect turns in ask-mode debates
    oracle_debate: "#d3869b" # gruvbox pink — oracle turns in debates

# Execution wrapper for running tests (e.g. docker exec, lxc exec, or blank if native)
## for literature review pipeline
# test_command_prefix: "bash"
# test_runner: "{file}"
# test_naming_and_path: "tests/testthat/test-{stem}.R"

# for code pipeline now
test_command_prefix: "docker exec -i --user bryanr -w /home/bryanr/wf/BaseFeatures -e RETICULATE_PYTHON=/home/bryanr/.venv-rocker/bin/python3 rocker-rstudio"

# Command template applied to a test/validation file ({file} is substituted).
# Default (R): "Rscript .aider_factory/tests/run_tests.R {file}". Here we run the
# validation .sh directly, so prefix "bash" + "{file}" => `bash <script>`.

test_runner: "Rscript .aider_factory/tests/run_tests.R {file}"

# Auto-naming convention for a per-target test file when files.test_files is omitted
# ({stem} -> target basename). Unused here because test_files is given explicitly.

test_naming_and_path: "tests/testthat/test-{stem}.R"
loop_aider_test: 3
# --- Knowledge Oracle + OCR RAG ---
ocr_api_base: "http://192.168.100.2:8081/v1" # Dedicated GLM-OCR vision endpoint
# just DEFAULTS that per-phase settings may override.
rag:
    collection_name: "alpha_strategies" # default collection (job folder & lancedb table name)
    overwrite: true # false = reuse existing lancedb/ (cache hit)
    ocr_agent: "glm-ocr-f16:LATEST" # prefix stripped -> POSTs "glm-ocr-f16:LATEST" (preset/alias name)
    ocr_prompt: "Extract the text, tables, and mathematical formulas from this page into clean Markdown. Preserve all structural integrity."
    embed_model: "qwen3-embedding-8b-8k:LATEST" # Swap to BAAI/bge-m3 if no GPU api_base is available
    embed_backend: "openai" # "openai" | "sentence-transformers"
    embed_api_base: "http://192.168.100.2:8080/v1"
    query_prefix: "Instruct: Given a coding or financial query, retrieve relevant passages\nQuery: "
    chunk_size_chars: 800
    chunk_overlap_chars: 100
    top_k: 30 # top_k chunks the oracle retrieves when it judges failing quotes (heal)
    retrieval_mode: top_k # interactive /run oracle strategy (NOT the --auto path): top_k | no_retrieve | full_document
    cer_threshold: 0.05 # Max allowable Character Error Rate (5%)
    ocr_max_retries: 2
    ocr_parallel: 8 # on halo strix 8-10 pages seems optimal.

# Global Endpoints (can be accessed by all phases)
endpoints:
    architect_api_base: "http://192.168.100.1:8080/v1" # llama remote (tablet)
    # architect_api_base: http://localhost:11435/v1 ## Ollama remote (tablet)
    editor_ollama_api: "http://192.168.100.1:8080/v1" # llama desktop
    editor_test_ollama_api: "http://192.168.100.1:8080/v1"
    rag_agent_api: "http://192.168.100.1:8080/v1" # Oracle side-agent endpoint
    grounding_agent_api: "http://192.168.100.1:8090/v1" # MiniCheck entailment verifier shim
    # editor_ollama_api: "http://localhost:11434" # Ollama desktop
    # editor_test_ollama_api: "http://localhost:11434"

phases:
    - name: "Code — unit tests leverage_lq_b"
      enabled: false # toggle on when ready (and set the code test runner top-level)
      batch: true # one shared table for the whole corpus (repos + literature)
      oracle:
          job_debate_template: []
              # ".aider_factory/markdown/templates/job_debate.md"
          template: ".aider_factory/markdown/internal/analyze_bugs.md"
          start_job: false # CODE MODE: no generate; template seeds the debate (oracle debugger)
          architect_oracle_chat: true
      vector_store:
          collection_name: "BaseFeatures_lib"
      toggles:
          sticky_context: true # tested file #1 becomes context for file #2's job_one
          pair_programming: false
          run_job_one: false # implement -> plans.job_one_plan
          run_job_two: true # write unit tests -> plans.job_two_plan
          iterate_test: true # test-fix loop (loop_aider_test attempts)
          auto_test: false # false = architect+editor each attempt; true = 3 editor-only inner loops
          run_ocr_rag: false # ingest the corpus into LanceDB first (false once built = reuse)
          vectordb_overwrite: false
      oracle_toggles:
          debate_loops: 5 # architect<->oracle turns within one debate (stops early on agreement)
          debate_rounds: 3 # escalation cycles after loop_aider_test exhausts
          # post_validate / validation_tag / region_* / validation_loops are grounding-only -> IGNORED in code mode
          pass_round_history: true
      models:
          architect_agent: "gemini/gemini-3.5-flash"
          editor_agent: "gemini/gemini-2.5-flash"
          editor_agent_test: "gemini/gemini-2.5-flash"
          editor_agent_test_fallback: "gemini/gemini-2.5-flash"
          rag_agent: "gemini/gemini-3.1-pro-preview" # the oracle (retrieves from the corpus table)
          ocr_agent: "glm-ocr-f16:LATEST" # local OCR (only used when run_ocr_rag: true)
      files:
          target_files:
              - "R/lq_leverage_b.R"
          extra_editable_files:
              - "R/helpers_kv.R"
              - "R/helpers.R"
              - "R/lq_leverage_bl.R"
          test_files:
              - "tests/testthat/test-unit-lq_leverage_b.R"
          context_files_job:
              - "R/queries.R"
              - "R/reservations.R"
              - "R/validations.R"
          context_files_test:
              - "R/queries.R"
              - "R/reservations.R"
              - "R/validations.R"
      ocr_prompt: "Extract text, tables, math, code, and documentation into clean Markdown. Preserve all structural integrity."
      plans:
          job_one_plan: "markdown/templates/general.md"
          job_two_plan: "markdown/templates/testing.md"
          iterate_plan: "markdown/templates/testing_unit_iterate.md"
    # deliberate_plan omitted -> code mode uses oracle_auto.template (analyze_bugs.md)

    - name: "Code — integration tests leverage_lq_l"
