name: Cross-Platform CI
on:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: "pyproject.toml"

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Configure Git (Required Aider)
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"

    - name: Install dependencies
      run: uv sync

    - name: Install Playwright Browsers
      run: uv run playwright install chromium

    - name: Cache Hugging Face models
      uses: actions/cache@v4
      with:
        path: ~/.cache/huggingface
        key: ${{ runner.os }}-hf-models-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-hf-models-

    - name: Run Test Suite
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        # Auto-answer Aider prompts in CI
        AIDER_YES: "1"
        AIDER_NO_GITIGNORE: "1"
        # Standard flag to let tests know they are in cloud CI
        CI: "true"
      run: |
        python src/aider_factory/tests/uv_run.py
