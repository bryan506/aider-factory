name: "My Project"
working_directory: "/path/to/project"

# Test execution — adapt to your language and environment
test_command_prefix: ""                        # wrapper: "docker exec -i my-container"
test_runner: "pytest {file}"                   # R: "Rscript .aider_factory/tests/run_tests.R {file}"
test_naming_and_path: "tests/test_{stem}.py"   # auto-generates test path when test_files omitted
loop_aider_test: 3                             # max test-fix attempts per target file

# Uncomment for local model endpoints (not needed for gemini/ or github_copilot/ prefixes)
# endpoints:
#     architect_api_base: "http://localhost:8080/v1"     # openai/ prefix models
#     editor_ollama_api: "http://localhost:11434"         # ollama/ prefix models
#     editor_test_ollama_api: "http://localhost:11434"

models:
    architect_agent: "gemini/gemini-2.5-flash"
    editor_agent: "gemini/gemini-2.5-flash"
    editor_agent_test: "gemini/gemini-2.5-flash"
    editor_agent_test_fallback: "gemini/gemini-2.5-flash"

plans:
    job_one_plan: "markdown/templates/implement.md"
    job_two_plan: "markdown/templates/testing.md"
    # iterate_plan: "markdown/templates/testing_unit_iterate.md"

phases:
    - name: "Implement and Test"
      enabled: true

      rag:
          collection_name: ""
          batch: true
          retrieval_mode: top_k
          run_ocr_rag: false
          vectordb_overwrite: false
          ocr_prompt: "Extract the text, tables, and mathematical formulas from this page into clean Markdown. Preserve all structural integrity."
          query_prefix: "Instruct: Given a coding or financial query, retrieve relevant passages\nQuery: "
          chunk_size_chars: 800
          chunk_overlap_chars: 100
          top_k: 5
          cer_threshold: 0.05
          ocr_max_retries: 2
          ocr_parallel: 1
          ocr_max_tokens: 4096
          code_chunk_size: 2000
          working_repo: ""
          code_exts: null
          text_doc_exts: null
          ignore: null

      oracle:
          start_job: false
          template: ""
          full_document: false
          pre_edit_debate:
              enabled: false
              job_debate_template: []

      toggles:
          pair_programming: false      # fully autonomous
          run_job_one: true            # architect plans implementation, editor writes code
          run_job_two: true            # architect plans tests, editor writes them
          iterate_test: true           # test-fix loop (up to loop_aider_test attempts)
          auto_test: true              # true = 3 editor-only attempts then architect; false = architect every attempt
          sticky_context: false        # true = completed file becomes read-context for the next

      validation:
          enabled: false
          validation_tag: "evidence"
          region_threshold: 0.60
          region_margin: 2
          region_paragraphs: 0
          region_top_k: 5
          validation_loops: 3
          redo_oracle_job: false
          verify_all_claims: false
          entail_threshold: 0.5

      escalation_debate:
          loops: 0
          rounds: 1
          pass_history: false

      files:
          target_files:
              - "src/my_module.py"
          extra_editable_files: []             # additional files the editor may modify
          test_files:
              - "tests/test_my_module.py"
          context_files_job:                   # read-only context for implementation
              - "src/helpers.py"
          context_files_test:                  # read-only context for test writing + iterate
              - "src/helpers.py"

