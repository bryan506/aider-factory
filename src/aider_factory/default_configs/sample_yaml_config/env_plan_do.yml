name: "My Project"
working_directory: "/path/to/project"

# oracle and side-agent debate conversation colors.
colors:
    architect_debate: "#38bdf8" # teal — architect turns in ask-mode debates
    oracle_debate: "#d3869b" # gruvbox pink — oracle turns in debates

test_command_prefix: ""
test_runner: "uv run --with pytest pytest {file}"
test_naming_and_path: "tests/test_{stem}.py"
lint_cmd: null
auto_lint: true
loop_aider_test: 3

## above test_ values resolve to "test_cmd = f"{test_command_prefix} {test_runner.replace('{file}', specific_test_file)}" in the source scripts. Adjust for desired language and test behavior if aider-helper does not get it right.

# 3. GLOBAL API ENDPOINTS (Unified: All network addresses live here)
endpoints: # set multiple local endpoints, ignored when cloud model chosen
    architect_api_base: "http://192.168.100.2:8080/v1"
    editor_api: "http://192.168.100.1:8080/v1"
    editor_api_fallback: "http://192.168.100.1:8080/v1"
    rag_agent_api: "http://192.168.100.1:8080/v1"
    grounding_agent_api: "http://192.168.100.2:8090/v1"
    ranking_api_base: "http://192.168.100.1:8080/v1"
    ocr_api_base: "http://192.168.100.2:8081/v1"
    embed_api_base: "http://192.168.100.1:8080/v1"

phases: # DAG phases, name multiple phase for multi-stage workflows if requested
  - name: "Architect Planning Phase"
    enabled: true

    models:
        architect_agent: "gemini/gemini-3.8-flash"
        editor_agent: "gemini/gemini-3.7-flash"
        editor_agent_test: "gemini/gemini-3.7-flash"
        editor_agent_test_fallback: "gemini/gemini-3.7-flash"
        rag_agent: "gemini/gemini-3.7-flash"
        ranking_agent: "jinaai/jina-reranker-v3.5"
        ocr_agent: "gemini/gemini-3.7-flash"
        embed_model: "gemini/text-embedding-004"
        grounding_agent: "openai/minicheck-flan-t5-large"

    rag:
        collection_name: "working_repo_lib"
        retrieval_mode: top_k # top_k, no_retrieve, full_document
        embed_backend: "sentence-transformers" # openai, sentence-transformers
        query_prefix: "Instruct: Given a coding or financial query, retrieve relevant passages\\nQuery: " # important for embedder chunk retrieval
        ocr_prompt: "<|grounding|>Convert the document to markdown."

    oracle:
        start_job: false
        template: ""

    toggles:
        pair_programming: true # Interactive mode with terminal chat
        run_job_one: true # Run first edit phase (implement plan)
        run_job_two: false # Run second edit phase (validate/audit spec)
        run_job_three: false # Run third edit phase (write tests)
        iterate_test: false # Loop tests automatically until they pass
        auto_test: false # Let Aider run tests natively (3 loops)
        shared_history: false # Isolate chat history per-file
        sticky_context: false # Keep edits from prior tasks in context
        ## settings jto help with KV cache and autonomous vs paired sessions
        map_tokens: 0 # Token limit for repo map (0 = disabled)
        map_refresh: "manual" # Repo map refresh mode (manual/auto/always)
        map_multiplier_no_files: 0 # Map multiplier when no files loaded
        max_chat_history_tokens: 40000 # Chat token budget before truncation
        yes_always: false # Auto-confirm all prompts
        auto_accept_architect: false # Auto-apply architect proposal to editor
        auto_commits: true # Auto-commit git changes after each edit
        suggest_shell_commands: true # Allow model to propose shell commands
        detect_urls: false # Scrape URLs found in model responses
        disable_playwright: false # Prevent automated headless browser installs

    files:
        target_files:
            - ".aider_factory/markdown/oracle_pre_plan/strategy_template.md"
        extra_editable_files: []
        test_files: []
        context_files_job: []
        context_files_test: []

    plans:
        job_one_plan: "markdown/oracle_pre_plan/strategy_instruct_template.md"
        job_two_plan: []
        job_three_plan: []
        iterate_plan: []


  - name: "Code — Implement, Validate, Test, Debate-Escalate"
    enabled: true
    test_naming_and_path: "tests/unit/test_{stem}.py"

    sticky_phases:
        editable: true
        readonly: true

    models:
        architect_agent: "gemini/gemini-3.8-flash"
        editor_agent: "gemini/gemini-3.7-flash"
        editor_agent_test: "gemini/gemini-3.7-flash"
        editor_agent_test_fallback: "gemini/gemini-3.7-flash"
        rag_agent: "gemini/gemini-3.7-flash"
        ranking_agent: "jinaai/jina-reranker-v3.5"
        ocr_agent: "gemini/gemini-3.7-flash"
        embed_model: "gemini/text-embedding-004"
        grounding_agent: "openai/minicheck-flan-t5-large"

    rag:
        collection_name: "working_repo_lib"
        retrieval_mode: top_k # top_k, no_retrieve, full_document
        embed_backend: "sentence-transformers" # openai, sentence-transformers
        query_prefix: "Instruct: Given a coding or financial query, retrieve relevant passages\\nQuery: " # important for embedder chunk retrieval
        ocr_prompt: "<|grounding|>Convert the document to markdown."

    oracle:
        start_job: false
        template: "markdown/internal/analyze_bugs.md"
        full_document: false
        pre_edit_debate:
            enabled: true
            insert_debate: [0, 0, 1]              # Pre-test debate triggered before Job 3
            loops: 3                              # 3 turns to reach consensus on test matrix
            oracle_file: ""
            architect_file: ""
            job_debate_template: "markdown/templates/testing_debate.md"
            job_debate_collection: ""             # Bypass RAG retrieval; Oracle audits target file AST

    toggles:
        pair_programming: false
        run_job_one: true
        run_job_two: true
        run_job_three: true
        iterate_test: true
        auto_test: false
        shared_history: false
        sticky_context: false
        ## settings to help with KV cache and autonomous vs paired sessions
        map_tokens: 0
        map_refresh: "manual"
        map_multiplier_no_files: 0
        max_chat_history_tokens: 100000
        yes_always: true
        auto_accept_architect: true
        auto_commits: true
        suggest_shell_commands: true
        detect_urls: false
        disable_playwright: false

    escalation_debate:
        loops: 4
        rounds: 2
        pass_history: true
        oracle_persona: ""
        architect_persona: ""
        oracle_file: ""
        architect_file: ""

    files:
        target_files: []
        extra_editable_files: []
        test_files: []
        context_files_job: []
        context_files_test: []

    plans:
        job_one_plan: ".aider_factory/markdown/oracle_pre_plan/strategy_template.md"
        job_two_plan: "markdown/templates/validate.md"
        job_three_plan: "markdown/templates/testing_exec.md"
        iterate_plan: "markdown/templates/testing_unit_iterate.md"

  - name: "Post-Implementation Review & Follow-up"
    enabled: true

    sticky_phases:
        editable: true
        readonly: true

    models:
        architect_agent: "gemini/gemini-3.8-flash"
        editor_agent: "gemini/gemini-3.8-flash"
        editor_agent_test: "gemini/gemini-3.8-flash"
        editor_agent_test_fallback: "gemini/gemini-3.8-flash"
        rag_agent: "gemini/gemini-3.7-flash"
        ranking_agent: "jinaai/jina-reranker-v3.5"
        ocr_agent: "gemini/gemini-3.7-flash"
        embed_model: "gemini/text-embedding-004"
        grounding_agent: "openai/minicheck-flan-t5-large"

    rag:
        collection_name: "working_repo_lib"
        retrieval_mode: top_k # top_k, no_retrieve, full_document
        embed_backend: "sentence-transformers" # openai, sentence-transformers
        query_prefix: "Instruct: Given a coding or financial query, retrieve relevant passages\\nQuery: " # important for embedder chunk retrieval
        ocr_prompt: "<|grounding|>Convert the document to markdown."

    oracle:
        start_job: false
        template: ""
        pre_edit_debate:
            enabled: false

    toggles:
        pair_programming: true
        run_job_one: true
        run_job_two: false
        run_job_three: false
        iterate_test: false
        auto_test: false
        shared_history: false
        sticky_context: false
        ## settings jto help with KV cache and autonomous vs paired sessions
        map_tokens: 0
        map_refresh: "manual"
        map_multiplier_no_files: 0
        max_chat_history_tokens: 60000
        yes_always: false
        auto_accept_architect: false
        auto_commits: true
        suggest_shell_commands: true
        detect_urls: false
        disable_playwright: false

    files:
        target_files: []
        extra_editable_files: []
        test_files: []
        context_files_job: []
        context_files_test: []

    plans:
        job_one_plan: "markdown/templates/post_test_validation.md"
        job_two_plan: []
        job_three_plan: []
        iterate_plan: []
