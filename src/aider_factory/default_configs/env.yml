name: "Basis Feature Refactor"
working_directory: "/home/bryanr/wf/BaseFeatures"

# Execution wrapper for running tests (e.g. docker exec, lxc exec, or blank if native)
test_command_prefix: "docker exec -i --user bryanr -w /home/bryanr/wf/BaseFeatures -e RETICULATE_PYTHON=/home/bryanr/.venv-rocker/bin/python3 rocker-rstudio"
loop_aider_test: 3
# --- Knowledge Oracle + OCR RAG ---
ocr_api_base: "http://192.168.100.1:8081/v1"   # Dedicated GLM-OCR vision endpoint
# RAG/OCR is a MOVABLE per-phase node: enable via a phase's toggles.run_ocr_rag +
# vector_store.collection_name. The block below is just DEFAULTS for those phases.
# (For a one-off manual build outside the pipeline: python rag_manager.py <this.yml>)
rag:
  collection_name: "alpha_strategies"
  overwrite: false
  ocr_agent: "glm-ocr-f16:latest" # prefix stripped -> POSTs "glm-ocr-f16:latest" (preset/alias name)
  ocr_prompt: "Extract the text, tables, and mathematical formulas from this page into clean Markdown. Preserve all structural integrity."
  embed_model: "qwen3-embedding-8b-8k:LATEST"  # Swap to BAAI/bge-m3 if no GPU api_base is available
  embed_backend: "openai"                      # "openai" | "sentence-transformers"
  embed_api_base: "http://192.168.100.1:8080/v1"
  query_prefix: "Instruct: Given a coding or financial query, retrieve relevant passages\nQuery: "
  chunk_size_chars: 800
  chunk_overlap_chars: 100
  top_k: 5 # how MANY chunks top_k retrieval returns (distinct from retrieval_mode below)
  retrieval_mode: top_k # interactive /run oracle strategy (NOT the --auto path): top_k | no_retrieve | full_document
  #   top_k         = embed query, return top_k closest chunks (default; pair-programming & multi-doc safe)
  #   no_retrieve   = skip vector DB; reason directly over the question/--file (no KB grounding)
  #   full_document = dump the whole table for the collection (batch:false single-doc collections only)
  #   autonomous combos: multi-doc KB -> top_k | whole-file -> no_retrieve | per-paper deep task -> full_document (batch:false)
  #   (the --auto literature-review path ignores this and uses oracle_auto.full_document instead)

# Global Endpoints (can be accessed by all phases)
endpoints:
  architect_api_base: "http://localhost:11435/v1"
  editor_ollama_api: "http://localhost:11434"
  editor_test_ollama_api: "http://localhost:11434"
  rag_agent_api: "http://localhost:11435/v1" # Oracle side-agent endpoint

phases:
  # ---------------------------------------------------------
  # Phase 1: Implementation (.env_agent_a)
  # ---------------------------------------------------------
  - name: "Implement Leverage"
    enabled: false  # Toggle to false to skip if this phase already succeeded
    toggles:
      sticky_context: true # pass finished work as read-context to later phases (per-phase; moved from top-level)
      run_job_one: true
      run_job_two: false
      iterate_test: false
      auto_test: false  # false = architect input every attempt, true = architect input every 3 attempts and editor model looks at the output and tries to fix errors 3 times over with only it's own input. (trade off is usually speed over a slower higher impact run)
      pair_programming: false # start interactive session instead, prepare template prior for best results so it can have an initial prompt.
    models:
      architect_agent: "openai/minimax-229b-ud-iq4nl:latest"
      editor_agent: "ollama/qwen3.5-122B-80k:latest"
      editor_agent_test: "ollama/qwen3.5-122B-80k:latest"
      editor_agent_test_fallback: "ollama/qwen3.5-122B-80k:latest"
      rag_agent: "gemini/gemini-3.5-flash"
    files:
      target_files:
        - "R/lq_leverage.R"
      extra_editable_files:
        # - "R/helpers.R"
      context_files_job:
        # - "R/helpers.R"
        # - "R/helpers_kv.R"
        - "R/fut_aac.R"
      context_files_test:
    plans:
      job_one_plan: "markdown/templates/implement.md"
      # job_two_plan: "markdown/templates/testing.md"

  # ---------------------------------------------------------
  # Phase 2: Validation & Unit Test Writing
  # ---------------------------------------------------------
  - name: "Validation & Initial Unit Tests Leverage"
    enabled: false
    toggles:
      sticky_context: true # pass finished work as read-context to later phases (per-phase; moved from top-level)
      run_job_one: true
      run_job_two: true
      iterate_test: false
      pair_programming: false
      auto_test: true  # false = architect input every attempt, true = architect input every 3 attempts
    models:
      architect_agent: "github_copilot/gpt-5.4"
      editor_agent: "ollama/qwen3.5-122B-80k:latest"
      editor_agent_test: "ollama/qwen3.5-122B-80k:latest"
      editor_agent_test_fallback: "ollama/qwen3.5-122B-80k:latest"
      rag_agent: "gemini/gemini-3.5-flash"
    files:
      target_files:
        - "R/lq_leverage.R"
        # - "R/helpers_kv.R"
      extra_editable_files:
        # - "R/helpers.R"
      test_files:
        - "tests/testthat/test-unit-lq_leverage.R"
        # - "tests/testthat/test-helpers-kv.R"
      context_files_job:
        # - "R/helpers_kv.R"
        # - "R/helpers.R"
        - "R/fut_aac.R"
        # - "R/queries.R"
        # - "R/reservations.R"
        # - "R/validations.R"
      context_files_test:
        # - "R/helpers.R"
        # - "R/helpers_kv.R"
        # - "R/queries.R"
        # - "R/reservations.R"
        # - "R/validations.R"
    plans:
      job_one_plan: "markdown/templates/validate.md"
      job_two_plan: "markdown/templates/testing.md"


  - name: "Unit Iteration Tests leverage"
    enabled: true
    toggles:
      sticky_context: true # pass finished work as read-context to later phases (per-phase; moved from top-level)
      run_job_one: false
      run_job_two: false
      iterate_test: true
      pair_programming: true
      auto_test: true  # false = architect input every attempt, true = architect input every 3 attempts
    models:
      architect_agent: "gemini/gemini-3.5-flash"
      editor_agent: "gemini/gemini-3-flash-preview"
      editor_agent_test: "gemini/gemini-3-flash-preview"
      editor_agent_test_fallback: "gemini/gemini-3-flash-preview"
      rag_agent: "gemini/gemini-3.5-flash"
    files:
      target_files:
        - "R/lq_leverage.R"
        # - "R/helpers.R"
        # - "R/helpers_kv.R"
      extra_editable_files:
          # - "R/helpers.R"
      test_files:
        - "tests/testthat/test-unit-lq_leverage.R"
        # - "tests/testthat/test-helpers.R"
        # - "tests/testthat/test-helpers-kv.R"
      context_files_job:
          # - "R/helpers_kv.R"
          # - "R/helpers.R"
          # - "R/fut.R"
          # - "R/reservations.R"
          # - "R/validations.R"
      context_files_test:
          # - "R/helpers.R"
          # - "R/helpers_kv.R"
          # - "R/queries.R"
          # - "R/reservations.R"
          # - "R/validations.R"
    plans:
      job_one_plan:
      # "markdown/templates/validate.md"
      # job_two_plan: "markdown/templates/testing_helpers.md"
