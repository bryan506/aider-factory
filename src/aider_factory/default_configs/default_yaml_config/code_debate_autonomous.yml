name: "My Project"
working_directory: "/path/to/project"

test_command_prefix: ""
test_runner: "pytest {file}"
test_naming_and_path: "tests/test_{stem}.py"
loop_aider_test: 3

# RAG embedding (sentence-transformers runs locally — no endpoint needed)
rag:
    collection_name: "project_docs"
    overwrite: false                           # true = rebuild vector store from scratch
    embed_model: "BAAI/bge-m3"
    embed_backend: "sentence-transformers"     # local embedding; no embed_api_base required
    query_prefix: "Instruct: Given a coding query, retrieve relevant passages\nQuery: "
    chunk_size_chars: 800
    chunk_overlap_chars: 100
    top_k: 30
    retrieval_mode: top_k

# Uncomment for local model endpoints (not needed for gemini/ prefixes)
# endpoints:
#     architect_api_base: "http://localhost:8080/v1"
#     editor_ollama_api: "http://localhost:8080/v1"
#     editor_test_ollama_api: "http://localhost:8080/v1"
#     rag_agent_api: "http://localhost:8080/v1"

phases:
    # Phase 0: architect + oracle debate to build an implementation strategy.
    # The pre-edit debate (architect_oracle_chat) runs before job_one. The debate
    # verdict becomes job_one's instruction file. job_one writes the strategy to the
    # target file. Phase 1 picks it up via sticky_context.
    #
    # job_two and iterate_test are off — this phase only builds the strategy document.
    - name: "Strategy — Debate and Plan"
      enabled: true
      batch: true
      oracle:
          # Create this template with your problem-specific debate instructions.
          # Architect analyzes the problem, consults the oracle for evidence, and
          # produces a strategy. Must end with: PROPOSAL: <one-line summary>
          job_debate_template: ".aider_factory/markdown/templates/strategy_debate.md"
          template: ".aider_factory/markdown/internal/analyze_bugs.md"
          start_job: false                     # CODE mode
          architect_oracle_chat: true          # debate before job_one
      vector_store:
          collection_name: "project_docs"
      toggles:
          run_job_one: true                    # verdict feeds job_one, which writes to target
          run_job_two: false                   # no tests for the strategy document
          iterate_test: false                  # no test loop for strategy
          pair_programming: false
          sticky_context: true                 # strategy_template.md carries to Phase 1
          run_ocr_rag: false                   # true on first run to ingest code/docs
          vectordb_overwrite: false
      oracle_toggles:
          debate_loops: 4                      # max architect/oracle turns
          debate_rounds: 2                     # full debate cycles
          pass_round_history: true             # persist context across rounds
      models:
          architect_agent: "gemini/gemini-2.5-flash"
          editor_agent: "gemini/gemini-2.5-flash"
          rag_agent: "gemini/gemini-2.5-flash"
      files:
          target_files:
              - ".aider_factory/markdown/oracle_pre_plan/strategy_template.md"
      plans:
          job_one_plan: "markdown/templates/general.md"

    # Phase 1: implement from the strategy with pre-edit debates and escalation.
    # sticky_context carries strategy_template.md as read context for all jobs.
    # Three debate points fire automatically:
    #   1. Pre-job1 debate (architect_oracle_chat) — plan the implementation
    #   2. Pre-job2 debate (architect_oracle_chat) — plan the tests
    #   3. Post-iterate escalation (debate_loops > 0) — diagnose test failures
    - name: "Implementation — Debate and Build"
      enabled: true
      batch: true
      oracle:
          job_debate_template: ".aider_factory/markdown/templates/strategy_debate.md"
          template: ".aider_factory/markdown/internal/analyze_bugs.md"
          start_job: false
          architect_oracle_chat: true          # debates before job_one AND job_two
      vector_store:
          collection_name: "project_docs"
      toggles:
          run_job_one: true
          run_job_two: true
          iterate_test: true
          auto_test: false                     # architect every attempt
          pair_programming: false
          sticky_context: true                 # carries strategy from Phase 0
          run_ocr_rag: false                   # already ingested in Phase 0
          vectordb_overwrite: false
      oracle_toggles:
          debate_loops: 4                      # pre-job + escalation debate turns
          debate_rounds: 2                     # escalation cycles on test failure
          pass_round_history: true
      models:
          architect_agent: "gemini/gemini-2.5-flash"
          editor_agent: "gemini/gemini-2.5-flash"
          editor_agent_test: "gemini/gemini-2.5-flash"
          editor_agent_test_fallback: "gemini/gemini-2.5-flash"
          rag_agent: "gemini/gemini-2.5-flash"
      files:
          target_files:
              - "src/my_module.py"
          extra_editable_files:
              - "src/helpers.py"
          test_files:
              - "tests/test_my_module.py"
          context_files_job:
              - "src/utils.py"
          context_files_test:
              - "src/utils.py"
      plans:
          job_one_plan: "markdown/templates/implement.md"
          job_two_plan: "markdown/templates/testing.md"
          iterate_plan: "markdown/templates/testing_unit_iterate.md"

