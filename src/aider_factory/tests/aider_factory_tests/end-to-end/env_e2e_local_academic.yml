name: "Local E2E Academic Research Test"
working_directory: "/home/ares/R/aider_factory_dev"

colors:
    architect_debate: "#38bdf8"
    oracle_debate: "#d3869b"

test_command_prefix: ""
test_runner: "echo 'Academic research smoke test'"
test_naming_and_path: "tests/test_{stem}.py"
loop_aider_test: 1

models:
    architect_agent: "openai/qwen3.6-27b-90k:latest"
    editor_agent: "lm_studio/qwen3.6-27B-90k-udq4kxl:LATEST"
    editor_agent_test: "lm_studio/qwen3.6-27B-90k-udq4kxl:LATEST"
    editor_agent_test_fallback: "lm_studio/qwen3.6-27B-90k-udq4kxl:LATEST"
    rag_agent: "openai/qwen3.6-27B-90k-udq4kxl-rag:latest"
    ocr_agent: "glm-ocr-f16:LATEST"
    embed_model: "qwen3-embedding-8b-8k:LATEST"
    grounding_agent: "openai/minicheck-flan-t5-large"

endpoints:
    architect_api_base: "http://192.168.100.2:8081/v1"
    editor_ollama_api: "http://192.168.100.1:8080/v1"
    editor_test_ollama_api: "http://192.168.100.1:8080/v1"
    rag_agent_api: "http://192.168.100.2:8081/v1"
    grounding_agent_api: "http://192.168.100.1:8090/v1"
    ocr_api_base: "http://192.168.100.2:8081/v1"
    embed_api_base: "http://192.168.100.1:8080/v1"

plans:
    job_one_plan: "markdown/templates/general.md"
    job_two_plan: "markdown/templates/testing.md"

phases:
  - name: "Academic Research Phase"
    enabled: true
    rag:
        collection_name: "e2e_web_smoke"
        batch: false
        retrieval_mode: top_k
        run_ocr_rag: true
        vectordb_overwrite: true
    oracle:
        start_job: true
        template: ".aider_factory/markdown/templates/literary_review_template.md"
        full_document: true
    toggles:
        pair_programming: false
        run_job_one: false
        run_job_two: false
        iterate_test: false
        auto_test: false
        sticky_context: false
    validation:
        enabled: true
        validation_tag: "evidence"
        region_threshold: 0.60
        region_margin: 2
        region_paragraphs: 0
        region_top_k: 5
        validation_loops: 3
    files:
        target_files:
            - "src/aider_factory/default_configs/.env_ocr_rag.yml"
